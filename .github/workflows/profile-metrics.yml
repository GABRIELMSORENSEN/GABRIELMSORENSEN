name: Refresh the loop archive
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/metrics.py
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render public GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/metrics.py
      - name: Save the public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg assets/languages.svg assets/activity.svg data/public-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public profile metrics"
          git push
